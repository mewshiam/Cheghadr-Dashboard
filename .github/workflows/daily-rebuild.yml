name: Daily full history rebuild

on:
  schedule:
    # 00:00 Tehran (20:30 UTC previous day) daily
    - cron: '30 20 * * *'
  workflow_dispatch:

# Shares the dashboard-live group with the live-update workflows so the
# rebuild never touches dashboard_data.json at the same time as them.
# queue: max (GitHub docs: up to 100 pending runs) means burst arrivals
# wait in line instead of cancelling the pending run (default: only ONE).
concurrency:
  group: dashboard-live
  cancel-in-progress: false
  queue: max

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update live prices first
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: python3 build_data.py --live-only || true

      - name: Rebuild full history
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: python3 build_data.py

      - name: Final live price update after rebuild
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: python3 build_data.py --live-only || true

      - name: Commit and push if changed
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # Self-healing push: if a live run landed first, drop our commit,
          # rebuild on top of the newest main and retry.
          pushed=false
          for i in 1 2 3; do
            git add data/dashboard_data.json
            git diff --cached --quiet || git commit -m "daily rebuild $(date -u +%Y-%m-%d)"
            if git pull --rebase origin main && git push; then
              pushed=true
              echo "pushed on attempt $i"
              break
            fi
            echo "attempt $i: push conflicted, rebuilding on latest main..."
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            python3 build_data.py
            python3 build_data.py --live-only || true
            sleep 5
          done
          $pushed || { echo "ERROR: could not push after 3 attempts"; exit 1; }
