name: Update live prices (oil)

on:
  schedule:
    # Every 10 min, 24/7 UTC (Brent/OPEC global market hours)
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch oil live prices (Brent, OPEC)
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: python3 build_data.py --live-only --only=oil

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/dashboard_data.json
          git diff --cached --quiet || git commit -m "oil live $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
