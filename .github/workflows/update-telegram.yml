name: Update live prices (Telegram)

on:
  schedule:
    # Every 10 min, 06:00-24:00 Tehran (02:30-20:30 UTC)
    - cron: '30,40,50 2 * * *'
    - cron: '*/10 3-19 * * *'
    - cron: '0,10,20 20 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Telegram live prices (dollar, tether)
        env:
          DASHBOARD_DATA_PATH: data/dashboard_data.json
        run: python3 build_data.py --live-only --only=telegram

      - name: Commit and push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/dashboard_data.json
          git diff --cached --quiet || git commit -m "telegram live $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
